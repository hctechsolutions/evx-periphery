[profile.default]
src = "src"
out = "out"
libs = ["lib"]

optimizer = true
optimizer_runs = 200
via_ir = true

auto_detect_remappings = false     
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin-contracts-upgradeable/=../evx-core/lib/openzeppelin-contracts-upgradeable",
  "base64-sol/=lib/base64/",
  "@evx-core/=lib/evx-core/src/",
  "@evx-periphery/=src/"
]

[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v3/YOUR_KEY"
hoodi = "https://hoodi.infura.io/v3/YOUR_KEY"
sepolia = "https://sepolia.infura.io/v3/YOUR_KEY"
localhost = "http://127.0.0.1:8545"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
